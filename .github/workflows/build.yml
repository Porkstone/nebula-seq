name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build, test and verify NuGet package
        shell: pwsh
        run: ./Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Seq.App.Nebula
          path: artifacts/
